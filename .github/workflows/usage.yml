name: Usage snapshot

# Copies anonymous usage counts from GoatCounter into usage/usage.json once a day.
# Needs a repository secret named GOATCOUNTER_TOKEN (GoatCounter API key with "read statistics").
# It never edits index.html or test/index.html.

on:
  schedule:
    - cron: "23 17 * * *"   # 01:23 Kuala Lumpur time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch usage counts
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GOATCOUNTER_SITE: talktime-dad
        run: node .github/scripts/usage.mjs
      - name: Save snapshot
        run: |
          if [ -n "$(git status --porcelain usage)" ]; then
            git config user.name "Talk Time usage"
            git config user.email "noreply@github.com"
            git add usage
            git commit -m "Usage snapshot"
            git pull --rebase
            git push
          else
            echo "No change"
          fi
